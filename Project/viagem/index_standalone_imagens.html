@media(max-width:1150px){.controls{grid-template-columns:repeat(3,1fr)}}@media(max-width:720px){.hero h1{font-size:24px}.controls{grid-template-columns:1fr}.grid{grid-template-columns:1fr;padding:0 10px}.toolbar{position:static}.card{min-height:auto}}

let filtered = [...ATTRACTIONS];

const $ = (id) => document.getElementById(id);
function brl(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function clean(s){return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
function uniq(arr){return [...new Set(arr.filter(Boolean))];}
function sourceList(item){return uniq([...(item.images||[])]);}

function loadSmartImage(img, sources, name){
  let i = 0;
  const box = img.closest('.photo') || img.parentElement;
  const loader = box?.querySelector('.loading');
  const setFallback = () => {
    if(loader) loader.remove();
    img.remove();
    const div = document.createElement('div');
    div.className = 'fallback';
    div.innerHTML = `<div>Foto não carregou<small>${escapeHtml(name)}<br>Verifique a conexão ou use o link do card.</small></div>`;
    box?.appendChild(div);
  };
  const next = () => {
    if (i >= sources.length) return setFallback();
    img.classList.remove('ready');
    img.src = sources[i++];
  };
  img.onload = () => { if(loader) loader.remove(); img.classList.add('ready'); };
  img.onerror = next;
  img.referrerPolicy = 'no-referrer';
  next();
}

function escapeHtml(text){return String(text??'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

function fillSelect(id, values){
  const sel=$(id); const current=sel.value;
  for(const value of values){const opt=document.createElement('option'); opt.value=value; opt.textContent=value; sel.appendChild(opt);}
  sel.value=current;
}

function setupFilters(){
  fillSelect('city', uniq(ATTRACTIONS.map(x=>x.city)).sort());
  fillSelect('period', uniq(ATTRACTIONS.flatMap(x=>x.recommended_period||[])).sort());
  fillSelect('category', uniq(ATTRACTIONS.flatMap(x=>x.category||[])).sort());
  ['city','period','price','prime','category','search','sort'].forEach(id => $(id).addEventListener('input', applyFilters));
}

function inPriceRange(item, range){
  if(!range) return true;
  const price = Number(item.price_per_person || 0);
  if(range==='free') return price === 0;
  if(range==='50') return price > 0 && price <= 50;
  if(range==='100') return price > 0 && price <= 100;
  if(range==='200') return price > 0 && price <= 200;
  if(range==='200+') return price > 200;
  return true;
}

function applyFilters(){
  const city=$('city').value, period=$('period').value, price=$('price').value, prime=$('prime').value, category=$('category').value, search=clean($('search').value), sort=$('sort').value;
  filtered = ATTRACTIONS.filter(item => {
    const matchesSearch = !search || clean([item.name,item.city,(item.category||[]).join(' '),item.observation].join(' ')).includes(search);
    return (!city || item.city===city)
      && (!period || (item.recommended_period||[]).includes(period))
      && inPriceRange(item, price)
      && (!prime || item.prime_gourmet===prime)
      && (!category || (item.category||[]).includes(category))
      && matchesSearch;
  });
  if(sort==='price-asc') filtered.sort((a,b)=>Number(a.price_per_person||0)-Number(b.price_per_person||0));
  if(sort==='price-desc') filtered.sort((a,b)=>Number(b.price_per_person||0)-Number(a.price_per_person||0));
  if(sort==='rating-desc') filtered.sort((a,b)=>Number(b.rating||0)-Number(a.rating||0));
  if(sort==='distance-asc') filtered.sort((a,b)=>Number(a.travel_time_minutes||999)-Number(b.travel_time_minutes||999));
  render();
}

function render(){
  const grid=$('grid'); grid.innerHTML='';
  $('count').textContent = `${filtered.length} de ${ATTRACTIONS.length} locais exibidos`;
  if(!filtered.length){grid.innerHTML='<div class="empty"><h2>Nenhum local encontrado</h2><p>Limpe algum filtro ou busque por outro nome.</p></div>';return;}
  for(const item of filtered){
    const priceText = Number(item.price_per_person||0) === 0 ? 'Gratuito' : brl(item.price_per_person);
    const period = (item.recommended_period||[]).join(', ');
    const cats = (item.category||[]).map(c=>`<span class="chip">${escapeHtml(c)}</span>`).join('');
    const maps = item.google_maps ? `<a href="${item.google_maps}" target="_blank" rel="noopener">Mapa</a>` : '';
    const official = item.official_link ? `<a href="${item.official_link}" target="_blank" rel="noopener">Site</a>` : '';
    const prime = item.prime_gourmet && item.prime_gourmet !== 'não' ? `<div class="prime">Prime Gourmet: ${escapeHtml(item.prime_gourmet)}${item.prime_benefit?` — ${escapeHtml(item.prime_benefit)}`:''}</div>` : '';
    const sources = sourceList(item);
    const thumbs = sources.slice(1,4).map(u=>`<span class="thumb"><img src="${u}" alt="${escapeHtml(item.name)} foto" referrerpolicy="no-referrer" loading="lazy" onerror="this.parentElement.style.display='none'"></span>`).join('');
    const card = document.createElement('article'); card.className='card';
    card.innerHTML = `
      <div class="photo"><div class="loading">Carregando foto...</div><img alt="${escapeHtml(item.name)}" loading="lazy"></div>
      <div class="content">
        <h2 class="title">${escapeHtml(item.name)}</h2>
        <div class="sub">${escapeHtml(item.city)} • ${escapeHtml(period || 'período livre')}</div>
        <div class="chips">${cats}</div>
        <div class="row">${item.duration_hours || '?'}h • ${item.travel_time_minutes ?? '?'} min do hotel</div>
        <div class="price">${priceText}</div>
        ${prime}
        <div class="rating">Nota: ${item.rating ?? 'a confirmar'}</div>
        <div class="thumbs">${thumbs}</div>
        <div class="obs">${escapeHtml(item.observation || '')}</div>
        <div class="actions">${maps}${official}</div>
      </div>`;
    grid.appendChild(card);
    loadSmartImage(card.querySelector('.photo img'), sources, item.name);
  }
}

setupFilters();
applyFilters();
